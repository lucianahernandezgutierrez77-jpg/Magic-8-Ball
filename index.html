<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="Style.css">
        <title>Magic 8 Ball</title>
    </head>

    <body>
        <main id="home-page">
        <h1>Magic 8 Ball</h1>
        <p>The universe has an answer for you...</p>

        <div class="magic-ball">
            <div class= "window-circle">
            <div class="ball-window">
                <div class="ball-answer">8</div>
            </div>
          </div>
         </div>

        <input type="text" id="questionbox" placeholder="What would you like to know?">
        <button class="ask-btn" onclick="askQuestion()">Ask the Magic 8 Ball</button>
        </main>

        <main id="answer-page" class="hidden">
            <h1>Your answer awaits...</h1>
            <p id="question-text"></p>
            <div class="magic-ball large-ball">
                <div class="window-circle">
                    <div class="ball-window">
                        <div class="ball-answer"></div>
                    </div>
                </div>
            </div>

            <button class="ask-btn hidden" id="ask-again-btn" onclick="askAgain()">Ask again</button>

        </main>
        <audio id="shake-sound" src="Sounds/shake.mp3"></audio>
        <audio id="bg-music" src="Sounds/background.mp3"></audio>
        <script src="script.js"></script>
    </body>
</html>
